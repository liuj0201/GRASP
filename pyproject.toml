[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "da-cf-gop"
version = "0.1.1"
description = "Dysarthria-aware confusion-focused, forced-alignment-free GoP experiments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.11"
dependencies = [
  "joblib==1.5.3",
  "threadpoolctl==3.6.0",
  "espeakng-loader==0.2.4",
  "numpy==1.26.4",
  "numba==0.65.1",
  "pandas==2.3.3",
  "phonemizer==3.3.0",
  "scikit-learn==1.4.1.post1",
  "scipy==1.15.3",
  "soundfile==0.13.1",
  "torch==2.6.0",
  "transformers==5.8.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
paper = ["matplotlib==3.9.4"]
web = ["fastapi==0.136.1", "uvicorn==0.47.0", "python-multipart==0.0.29", "httpx==0.28.1"]

[project.scripts]
da-cf-gop = "da_cf_gop.cli:main"
da-cf-homework = "da_cf_gop.homework_web:main"

[project.urls]
Repository = "https://github.com/liuj0201/GRASP"
Issues = "https://github.com/liuj0201/GRASP/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
da_cf_gop = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp/run"
